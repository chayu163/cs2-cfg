alias +j "jump 1 0 0"
alias -j "jump -999 0 0"
alias lj "+left;bind mouse_wheel -j"
alias +tick "jump 1 0 0"
alias -tick "forward -999 0 0;bind MWHEELDOWN +j"

alias +reset "+forward;bind MWHEELDOWN +tick;bind mouse_wheel lj"
alias -reset "-forward"
bind w +reset

alias +a "+left"
alias -a "left -999 0 0"
alias +d "+right"
alias -d "right -999 0 0"
bind a +a
bind d +d