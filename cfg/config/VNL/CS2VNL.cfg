//jumpbug
alias _checkw "-forward; alias checkw";
alias +w "+forward; alias checkw _checkw";
alias -w "checkw";

alias +resetJB "reset_jb;+w"
alias -resetJB "-w"

alias "reset_jb" "mwhdown1"
alias "mwhdown1" "bind MWHEELDOWN +jb1"

alias "+jb1" "+duck"
alias "-jb1" "bind MWHEELDOWN +jb2"

alias "+jb2" "-duck"
alias "-jb2" "+jump;bind MWHEELDOWN +jb3"

alias "+jb3" "-jump"
alias "-jb3" "bind MWHEELDOWN +jump;-forward"

//CJ
alias "cj_0"   "bind MWHEELDOWN +cj_1"

alias "+cj_1"  "+duck;"
alias "-cj_1"  "+jump; bind MWHEELDOWN +cj_2"

alias "+cj_2"  "-jump;"
alias "-cj_2"  "-forward; bind MWHEELDOWN +cj_3"

alias "+cj_3"  "-duck;"
alias "-cj_3"  "-jump; bind MWHEELDOWN +cj_4"

alias "+cj_4" "-duck"
alias "-cj_4" "bind MWHEELDOWN +jump"

alias "+resetcj" "cj_0;+w"
alias "-resetcj" "-w"

//switch


alias "jbOn" "play buttons/bell1;bind w +resetJB;bind MWHEELDOWN jb1"
alias "cjOn" "play buttons/blip2;bind w +resetcj;cj_0"

alias "switchCJ" "cjOn;bind mouse4 switchJB"
alias "switchJB" "jbOn;bind mouse4 switchCJ"

bind mouse4 switchCJ
bind w +resetJB