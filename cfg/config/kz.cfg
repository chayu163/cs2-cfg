// =====================================
// Checkpoint / 存点
// =====================================

// bind 1 kz_cp
// bind 2 kz_tp
// bind 3 kz_pause
// bind 4 kz_r

bind \ radio
bind 5 kz_pcp
bind 6 kz_ncp
bind x kz_undo
bind uparrow kz_ssp
bind downarrow kz_csp

// kz_checkpoint/kz_cp             设置存点
// kz_teleport/kz_tp               传送到存点
// kz_undo                         撤销传送
// kz_prevcp/kz_pcp                上一个存点
// kz_nextcp/kz_ncp                下一个存点
// kz_setstartpos/kz_ssp           设置自定义起点
// kz_clearstartpos/kz_csp         清除自定义起点
// kz_cpsound/kz_checkpointsound   存点音效开关
// kz_tpsound/kz_teleportsound     传送音效开关
// kz_cpmessage/kz_cpmsg           检查点消息开关


// =====================================
// Timer / 计时器
// =====================================

bind o kz_stop
bind g kz_sg

// kz_restart/kz_r                 重新开始
// kz_timerstopsound/kz_tss        计时结束音效开关
// kz_safeguard/kz_safe/kz_sg      Command Description - kz_safeguard
// kz_pro                          Command Description - kz_pro
// kz_stop                         停止计时
// kz_pause                        暂停计时
// kz_comparelevel                 比较记录的最高等级
// kz_recordvolume                 世界纪录音效音量
// kz_mapoverlay                   Command Description - kz_mapoverlay
// kz_sctop/kz_scoursetop/kz_smaptop 查询服务器排行榜


// =====================================
// Player / 玩家
// =====================================

bind , kz_spec
bind . kz_specs

  // 按住alt飞行
alias +nClip "kz_nc"
alias -nClip "kz_nc"
bind  alt    "+nClip";           

bind h kz_hide

// kz_spec                         观看玩家
// kz_specs/kz_speclist            列出当前观看玩家
// kz_hidelegs                     第一人称隐藏腿部
// kz_hide                         隐藏其他玩家
// kz_playercheck/kz_pc            检查玩家状态
// kz_globalcheck/kz_gc            显示全球 API 状态
// kz_noclip/kz_nc/noclip           切换飞行
// kz_pistol                       更改/移除手枪
// kz_hideweapon                   隐藏武器模型
// kz_fov                          更改 FOV
// kz_goto                         传送到玩家
// kz_modernperfstats/kz_mps       现代 bhop 统计
// kz_legacyperfstats/kz_lps       传统 bhop 统计
// kz_resetperfstats/kz_rps        重置 bhop 统计


// =====================================
// Jumpstats / 跳跃统计
// =====================================

bind j kz_jsalways
bind b kz_beam

// kz_jstier                      跳跃数据最低等级
// kz_jstierconsole               控制台跳跃数据最低等级
// kz_jssound                     跳跃提示音最低阈值
// kz_jsbroadcast                 广播跳跃提示最低阈值
// kz_jsbroadcastconsole          控制台广播最低等级
// kz_jsbroadcastsound            广播音效最低等级
// kz_jsalways                    始终显示跳跃数据
// kz_jsfailstats                 聊天显示失败统计
// kz_jsfailstatsconsole          控制台显示失败统计
// kz_jsextend                    显示详细跳跃数据
// kz_jsvolume                    跳跃数据音量
// kz_jumpstats/kz_js             起跳提示报告开关


// =====================================
// Measure / 测量
// =====================================

bind leftarrow kz_measure
bind rightarrow kz_measureblock

// kz_measure                     测量两点距离
// kz_measurestart                设置测量起点
// kz_measureend                  设置测量终点并计算
// kz_measureblock                测量方块距离


// =====================================
// Global / 全球
// =====================================

bind p kz_pb
bind t kz_tier

// kz_globalcheck/kz_gc           显示全球 API 状态
// kz_comparelevel                比较记录的最高等级
// kz_recordvolume                世界纪录音效音量
// kz_ctop/kz_coursetop/kz_maptop  地图排行榜
// kz_gctop/kz_gcoursetop/kz_gmaptop 全球排行榜
// kz_wr                          服务器/世界纪录
// kz_gpb                         全球个人最佳
// kz_pb                          个人最佳
// kz_tier                        当前/指定地图等级


// =====================================
// Map / 地图
// =====================================

bind End kz_end
bind l kz_lj
bind c kz_courses

// kz_end                         传送到终点
// kz_lj/kz_ljarea/kz_jsarea      传送到 LJ 房间
// kz_courses                     显示地图关卡列表
// kz_course                      传送/查看关卡
// kz_mapinfo/kz_mi               显示地图信息


// =====================================
// Replay / 重播
// =====================================

bind PgUp kz_rppause
bind i kz_rpinfo
bind n kz_panel

// kz_replay                      播放/查找回放
// kz_rpgoto/kz_rpseek            跳转回放时间
// kz_rpgototick                  跳转回放 Tick
// kz_rpinfo                      当前回放信息
// kz_rppause                     暂停/继续回放
// kz_rploadprogress              回放加载进度
// kz_rpcancelload                取消加载回放
// kz_replays                     列出已保存回放
// kz_rphidelegs                  回放 bot 腿部显示
// kz_rpsave                      保存过往游戏数据为回放


// =====================================
// Preference / 偏好设置 / 杂项
// =====================================

// MHUD 2.0 Setup
// basic
setinfo kzp_showPanel 1;
setinfo kzp_compactPanel 0;
// timer
setinfo kzp_mhudTimerEnabled 1;
setinfo kzp_mhudTimerY 36;
setinfo kzp_mhudTimerOutline 1;
setinfo kzp_mhudTimerDetailed 1;
setinfo kzp_mhudTimerProColor -1493187329;
setinfo kzp_mhudTimerTpColor -509149185;
// speed
setinfo kzp_mhudSpeedEnabled 1;
setinfo kzp_mhudSpeedX 0;
setinfo kzp_mhudSpeedY 10;
setinfo kzp_mhudSpeedSize 28;
setinfo kzp_mhudSpeedFont "stratum2-bold-monodigit";
setinfo kzp_mhudSpeedOutline 0;
setinfo kzp_mhudSpeedColor -5840385;
setinfo kzp_mhudSpeedCjColor 1911470335;
// prespeed
setinfo kzp_mhudPrespeedEnabled 1;
setinfo kzp_mhudPrespeedY 14;
// keys
setinfo kzp_mhudKeysEnabled 1;
setinfo kzp_mhudKeysX 0;
setinfo kzp_mhudKeysY 29;
setinfo kzp_mhudKeysSize 20;
setinfo kzp_mhudKeysFont "stratum2-bold-monodigit";
setinfo kzp_mhudKeysOutline 1;
setinfo kzp_mhudKeysOverlap 1;
setinfo kzp_mhudKeysLetters 1;
setinfo kzp_mhudKeysSquare 1;
setinfo kzp_mhudKeysBorder 0;
setinfo kzp_mhudKeysGlow 1;
setinfo kzp_mhudKeysColor -1;
setinfo kzp_mhudKeysOverlapColor -12566273;
// cp
setinfo kzp_mhudCheckpointEnabled 1;
setinfo kzp_mhudCheckpointX -44;
setinfo kzp_mhudCheckpointY -5;
setinfo kzp_mhudCheckpointSize 20;
setinfo kzp_mhudCheckpointFont "stratum2-bold-monodigit";
setinfo kzp_mhudCheckpointOutline 1;
setinfo kzp_mhudCheckpointColor -1499004929;

// F7切换夜视仪 gamma值越大画面越暗
alias "+NV" "r_fullscreen_gamma 0.8"
alias "-NV" "r_fullscreen_gamma 2.6"
alias "nvOn" "play buttons/bell1;+NV;bind F7 nvOff"
alias "nvOff" "play buttons/blip2;-NV;bind F7 nvOn"
bind F7 nvOn

// kz_mhud                       mhud预设
