// kz_showpaint                  涂色显示范围
// kz_cleardecals                清除涂色标记
// kz_tips                       提示开关
// kz_fov                        更改 FOV
// kz_recordvolume               世界纪录音效音量
// kz_mapoverlay                 Command Description - kz_mapoverlay
// kz_help                       显示帮助



