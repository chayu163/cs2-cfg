//═════════════════════    2. 准星&持枪设置    ════════════════════════════════
crosshair                  1    // 开启准星
cl_show_observer_crosshair 2    // [观察时]显示玩家所用准星<0.否 1.好友及队友 2.所有人>
r_drawtracers_firstperson  1    // 第一人称视角显示子弹轨迹 <1.开启 0.关闭>
//准星参数
cl_crosshairstyle                        3    // 准星风格 <0.默认 1.经典 2.动态 3.静态 4.十字>
cl_crosshair_recoil                      0    // 准星跟随后坐力 <1.开启 0.关闭>
cl_crosshairdot                          0    // 准星中心点 <1.开启 0.关闭>
cl_crosshairsize                         3  // 准星长度
cl_crosshairthickness                    0.3    // 准星粗细
cl_crosshairgap                         -4  // 准星间隙
cl_crosshair_drawoutline                 1    // 准星描边 <1.开启 0.关闭>
cl_crosshaircolor                        5    // 1~4预设覆盖_r _g _b设置，5自定义颜色
cl_crosshaircolor_r                      0    // 自定义颜色红色分量
cl_crosshaircolor_g                      255  // 自定义颜色绿色分量
cl_crosshaircolor_b                      0    // 自定义颜色蓝色分量
cl_crosshairalpha                        255  // 准星透明度 <0.完全透明 255.完全不透明>
cl_crosshair_t                           0    // T字准星 <1.开启 0.关闭>
cl_crosshairgap_useweaponvalue           0    // 根据武器自动调整准星间距 <1.开启 0.关闭>
cl_crosshairusealpha                     1    // 根据武器自动调整准星透明度 <1.开启 0.关闭>
cl_crosshair_dynamic_maxdist_splitratio  0.1 // 动态准星分离比例（越大分离越多）默认0.35
cl_crosshair_dynamic_splitalpha_innermod 1    // 动态准星内侧透明度修改 0.5默认
cl_crosshair_dynamic_splitalpha_outermod 0.5  // 动态准星外侧透明度修改 0.5默认
cl_crosshair_dynamic_splitdist           7    // 动态准星分离距离（越大分离越多）默认7
cl_crosshair_sniper_width                1    // 狙击枪十字线粗细
cl_fixedcrosshairgap                     1    // 固定准星间距（当cl_crosshairgap_useweaponvalue=0时生效）默认3

//持枪参数
// viewmodel_presetpos     1    // 持枪视角预设 <1.默认 2.写实 3.经典>
cl_prefer_lefthanded       0    // 偏好左手持枪 复活后刷新 <1.是 0.否>



